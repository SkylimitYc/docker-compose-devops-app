services:
  backend:
    build: ./backend
    container_name: devops-backend
    expose:
      - "5000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-devopsdb}
      DB_USER: ${POSTGRES_USER:-devopsuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devopspass}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: devops-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

  database:
    image: postgres:16-alpine
    container_name: devops-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devopsdb}
      POSTGRES_USER: ${POSTGRES_USER:-devopsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devopspass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsuser -d devopsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data: